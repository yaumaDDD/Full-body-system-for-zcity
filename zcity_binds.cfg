// ============================================================================
// ZCity - обязательные бинды (стандарт GMod, который перехватывает ZCity)
// Положите в garrysmod/cfg/ и выполните `exec zcity_binds.cfg` в консоли,
// либо скопируйте содержимое в garrysmod/cfg/autoexec.cfg.
//
// ВАЖНО: ZCity дополнительно читает ФИЗИЧЕСКИЕ клавиши напрямую
// (input.IsKeyDown / PlayerButtonDown): Q/C, 1, R, F, F4, F6, E, ALT,
// MOUSE_LEFT/RIGHT, MOUSE_WHEEL, ESC, IN_ZOOM. Их НЕЛЬЗЯ переназначить
// командой bind - сработает именно зашитая клавиша.
// Полный список: ZCity_binds.md
// ============================================================================

// --- Движение ---------------------------------------------------------------
bind "w"            "+forward"
bind "a"            "+moveleft"
bind "s"            "+back"
bind "d"            "+moveright"
bind "SPACE"        "+jump"
bind "CTRL"         "+duck"
bind "SHIFT"        "+speed"
bind "ALT"          "+walk"

// --- Взаимодействие (критично: без +use/+walk/+speed подсказки ругаются) ----
bind "e"            "+use"
bind "r"            "+reload"

// --- Бой --------------------------------------------------------------------
bind "MOUSE1"       "+attack"
bind "MOUSE2"       "+attack2"

// --- Селектор оружия ZCity --------------------------------------------------
bind "1"            "slot1"
bind "2"            "slot2"
bind "3"            "slot3"
bind "4"            "slot4"
bind "5"            "slot5"
bind "6"            "slot6"
bind "MWHEELUP"     "invprev"
bind "MWHEELDOWN"   "invnext"
// lastinv назначьте на свободную клавишу, например:
// bind "MOUSE4"    "lastinv"

// --- Меню -------------------------------------------------------------------
// Q в ZCity = круговое меню (radial), НЕ спавн-меню.
bind "q"            "+menu"
bind "c"            "+menu_context"
bind "TAB"          "+showscores"
bind "F1"           "gm_showhelp"
bind "F2"           "gm_showteam"
bind "F3"           "gm_showspare1"
// F4 оставлен как gm_showspare2: в Homicide его же занимает панель предателя
bind "F4"           "gm_showspare2"

// --- Чат / голос ------------------------------------------------------------
bind "y"            "messagemode"
bind "u"            "messagemode2"
bind "x"            "+voicerecord"

// --- Прочее GMod ------------------------------------------------------------
bind "f"            "impulse 100"     // фонарик / ЛЦУ (F также = меню вины ZCity)
bind "v"            "noclip"          // только админы: PlayerNoClip
bind "`"            "toggleconsole"

// ============================================================================
// НЕОБЯЗАТЕЛЬНО: команды ZCity без дефолтного бинда.
// Раскомментируйте и подставьте СВОБОДНЫЕ клавиши.
// ============================================================================
// bind "g"          "dropweapon"
// bind "MOUSE4"     "+hg_zoom"
// bind "MOUSE5"     "+altlook"
// bind "b"          "+hmcd_holdbreath"
// bind "kp_enter"   "woundsys_open_panel"   // панель ран C:U
// bind "kp_plus"    "wszc_open_wounds"      // то же, с gate WSZC_Ready
// bind "kp_minus"   "hg_options"
// bind "kp_multiply" "hg_appearance_menu"
// bind "kp_divide"  "hg_ammomenu"
// bind "MOUSE3"     "+zoom"                 // IN_ZOOM: зум камеры в Glide
// ============================================================================
// Glide (машины/вертолёты) настраивается НЕ здесь, а в Options -> Glide,
// сохраняется в garrysmod/data/glide.json. Дефолты: W/S газ-тормоз, A/D руль,
// SPACE ручник, R гудок/смена оружия, I двигатель, H фары, L сирена,
// K прицеп, LSHIFT модификатор, F/J/M передачи,стрелки ↑↓←→, 1..0 сиденья.
// ============================================================================
